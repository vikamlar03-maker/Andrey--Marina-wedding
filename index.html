<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Андрій & Марина</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ПЕРША ЗАСТАВКА -->
  <section id="intro" class="intro">

    <video
      id="introVideo"
      class="intro-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source src="Fone .mov" type="video/quicktime">
    </video>

    <div class="intro-shade"></div>

    <div class="intro-content">

      <div class="monogram">
        <span>A</span>
        <i></i>
        <span>M</span>
      </div>

      <p class="bible-text">
        «Отже, більше не буде їх двоє,<br>
        а буде одна плоть;<br>
        і нехай ніхто не роз’єднає тих,<br>
        кого Бог з’єднав разом».
      </p>

      <p class="bible-reference">
        Від Матвія 19:6
      </p>

      <button id="openInvitation" class="open-button" type="button">
        Відкрити запрошення
      </button>

    </div>

  </section>


  <!-- МУЗИКА -->
  <audio id="weddingMusic" loop preload="auto">
    <source src="Musik.m4a" type="audio/mp4">
  </audio>


  <!-- ОСНОВНА СТОРІНКА -->
  <main id="mainPage" class="main-page">

    <section class="first-photo">
      <img src="Foto1.PNG" alt="Андрій та Марина">
    </section>

  </main>


  <script>
  const intro = document.getElementById("intro");
  const mainPage = document.getElementById("mainPage");
  const music = document.getElementById("weddingMusic");

  function openInvitation() {
    music.play().catch(() => {});

    intro.style.transition =
      "opacity 1.2s ease, filter 1.2s ease, transform 1.2s ease";

    intro.style.opacity = "0";
    intro.style.filter = "blur(18px)";
    intro.style.transform = "scale(1.04)";

    setTimeout(() => {
      intro.style.display = "none";
      mainPage.style.display = "block";
      window.scrollTo(0, 0);
    }, 1200);
  }

  intro.addEventListener("click", openInvitation);
  intro.addEventListener("touchend", openInvitation);
</script>

</body>
</html>
