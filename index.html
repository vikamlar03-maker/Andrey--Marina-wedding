<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Андрій & Марина</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ПЕРША ЗАСТАВКА -->
  <section id="intro" class="intro">

    <video
      id="introVideo"
      class="intro-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source src="Fone .mov" type="video/quicktime">
    </video>

    <div class="intro-shade"></div>

    <div class="intro-content">

      <div class="monogram">
        <span>A</span>
        <i></i>
        <span>M</span>
      </div>

      <p class="bible-text">
        «Отже, більше не буде їх двоє,<br>
        а буде одна плоть;<br>
        і нехай ніхто не роз’єднає тих,<br>
        кого Бог з’єднав разом».
      </p>

      <p class="bible-reference">
        Від Матвія 19:6
      </p>

      <button id="openInvitation" class="open-button" type="button">
        Відкрити запрошення
      </button>

    </div>

  </section>


  <!-- МУЗИКА -->
  <audio id="weddingMusic" loop preload="auto">
    <source src="Musik.m4a" type="audio/mp4">
  </audio>


  <!-- ОСНОВНА СТОРІНКА -->
  <main id="mainPage" class="main-page">

    <section class="first-photo">
      <img src="Foto1.PNG" alt="Андрій та Марина">
    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
